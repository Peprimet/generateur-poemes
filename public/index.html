<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plume d'Étoile - Générateur de Poèmes</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: #121214;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #1e1e24;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 { text-align: center; color: #ff79c6; margin-bottom: 5px; font-size: 2em;}
        .subtitle { text-align: center; color: #aaa; margin-top: 0; margin-bottom: 25px; font-size: 0.9em;}
        
        label { display: block; margin: 15px 0 5px; color: #bd93f9; font-weight: bold; font-size: 0.95em;}
        
        textarea, select, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 6px;
            border: 1px solid #44475a;
            background: #282a36;
            color: #f8f8f2;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus, select:focus {
            outline: none;
            border-color: #ff79c6;
        }
        button {
            background: #ff79c6;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            margin-top: 15px;
            font-size: 16px;
        }
        button:hover { background: #ff92df; }
        button:disabled { background: #6272a4; cursor: not-allowed; }
        
        .output {
            margin-top: 25px;
            padding: 20px;
            background: #282a36;
            border-left: 4px solid #ff79c6;
            border-radius: 4px;
            white-space: pre-wrap;
            font-style: italic;
            line-height: 1.8;
            color: #f8f8f2;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Plume d'Étoile</h1>
    <p class="subtitle">Décrivez le poème que vous souhaitez obtenir</p>
    
    <label for="prompt">Votre demande :</label>
    <textarea id="prompt" placeholder="Ex: Un amour perdu sous la pluie, la solitude d'un phare..."></textarea>

    <label for="theme">Thème :</label>
    <select id="theme">
        <option value="libre">🎨 Libre (Mélange de tous les styles)</option>
        <option value="amour">💕 Amour</option>
        <option value="tristesse">😢 Tristesse</option>
        <option value="nature">🌿 Nature</option>
        <option value="nuit">🌙 Nuit</option>
        <option value="espoir">✨ Espoir</option>
    </select>

    <label for="lines">Nombre de vers :</label>
    <select id="lines">
        <option value="8">8 vers (Court)</option>
        <option value="16" selected>16 vers (Moyen)</option>
        <option value="24">24 vers (Long)</option>
        <option value="32">32 vers (Très long)</option>
    </select>

    <button id="generateBtn">✨ Composer le poème</button>

    <div id="result" class="output"></div>
</div>

<script>
    document.getElementById('generateBtn').addEventListener('click', async () => {
        const promptText = document.getElementById('prompt').value;
        const linesCount = document.getElementById('lines').value;
        const themeSelected = document.getElementById('theme').value;
        const resultDiv = document.getElementById('result');
        const btn = document.getElementById('generateBtn');

        if (!promptText.trim()) {
            alert("Dis-moi quel genre de poème tu veux générer !");
            return;
        }

        resultDiv.style.display = 'block';
        resultDiv.innerText = "L'inspiration vient... composition en cours...";
        btn.disabled = true;
        btn.innerText = "Composition en cours...";

        try {
            const response = await fetch('/generate-poem', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    prompt: promptText,
                    lines: linesCount,
                    theme: themeSelected
                })
            });

            const data = await response.json();
            if (data.poem) {
                resultDiv.innerText = data.poem;
            } else {
                resultDiv.innerText = "Erreur : " + data.error;
            }
        } catch (error) {
            resultDiv.innerText = "Impossible de se connecter au serveur.";
        } finally {
            btn.disabled = false;
            btn.innerText = "✨ Composer le poème";
        }
    });
</script>

</body>
</html>
